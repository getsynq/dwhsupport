version: 2
updates:
  # cli/ replaces github.com/getsynq/dwhsupport with ../, so a bump at the root
  # can move cli's indirect requirements too. The cli job in go.yml tidies
  # cli/ on Dependabot's pull requests and commits the result.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/cli"
    schedule:
      interval: "weekly"
